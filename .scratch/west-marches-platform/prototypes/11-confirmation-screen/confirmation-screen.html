<title>PROTOTYPE — the confirmation screen (ticket 11)</title>
<!--
  THROWAWAY PROTOTYPE. Ticket 11, .scratch/west-marches-platform/issues/11-prototype-confirmation-screen.md
  Not wired to Rails. Nothing here is feature code. Delete when the ticket resolves.

  Plan: three structurally different variants of what a Game Master sees when they confirm,
  switchable via ?variant=A|B|C, plus ?when=now|later and ?w=desktop|phone, all driven from
  the floating bar at the bottom.

    A  The Grid    — my dates x the quests targeting them; the cell is the party that pairing
                     would produce. Refuses to pick an axis. Extends 10's variant A into the
                     second axis ADR 0006 added.
    B  By Date     — a stack of cards, one per date I offered; each card is the quests
                     competing for it. Date-led: "I have Friday, what do I run?"
    C  By Quest    — a stack of cards, one per quest waiting on me; each card is the dates it
                     could run on. Quest-led: "this has been waiting three weeks, when?"

  RESOLVED: B won. A and C are kept because the ticket's argument is the disagreement
  between them, and they deserve to be seen rather than described. The scribe picker A, B and
  C all shared was struck — the scribe is derived, see scribeFor().

  Confirmation is live: confirming mutates in-memory state, spends the slot for every other
  quest, and redraws the board. Reload to reset.

  Rules implemented: ADR 0005 (the rota - bumps, then how long since a seat, then who declared
  first; binding, no override), ADR 0006 (slots are an unattached pool; several quests may
  target one date; a slot cannot be confirmed until its deadline, 72h before it starts, has
  passed; no minimum party size), ticket 05 (a character is never a candidate for a slot its
  own player offered).

  Times are bare UTC instants rendered in the browser with no zone label (ticket 04).
-->

<script>
/* =========================================================================
   FAKE DATA — you are Aldous Finch, a Game Master with four dates on offer.
   The stress case is Friday: three quests want it, and one of them has no
   other date in the world.
   ========================================================================= */

const YOU = 'Aldous Finch';

const CLOCKS = {
  now:   '2026-09-02T02:00:00Z',   // only Friday is past its deadline; Saturday closes in 2 hours
  later: '2026-09-10T10:00:00Z'    // Friday and Saturday have gone by; Sunday has just opened
};

// Players. The rota ranks PEOPLE, not characters (ADR 0005).
const PEOPLE = {
  ruth:   { player: 'Ruth Kelleher',   bumps: 3, lastSeat: null,         lastScribed: '2026-08-01' },
  sam:    { player: 'Sam Okafor',      bumps: 2, lastSeat: null,         lastScribed: null },
  tara:   { player: 'Tara Lindqvist',  bumps: 1, lastSeat: '2026-06-10', lastScribed: '2026-05-12' },
  marta:  { player: 'Marta Vance',     bumps: 1, lastSeat: '2026-07-29', lastScribed: '2026-07-20' },
  priya:  { player: 'Priya Raman',     bumps: 1, lastSeat: '2026-08-15', lastScribed: null },
  ben:    { player: 'Ben Adeyemi',     bumps: 0, lastSeat: null,         lastScribed: null },
  aldous: { player: 'Aldous Finch',    bumps: 0, lastSeat: '2026-07-02', lastScribed: '2026-06-30' },
  jonah:  { player: 'Jonah Reyes',     bumps: 0, lastSeat: '2026-08-05', lastScribed: '2026-08-10' },
  dmitri: { player: 'Dmitri Sarn',     bumps: 0, lastSeat: '2026-08-12', lastScribed: null },
  nia:    { player: 'Nia Osei',        bumps: 0, lastSeat: '2026-08-19', lastScribed: '2026-07-05' },
  felix:  { player: 'Felix Aumann',    bumps: 0, lastSeat: '2026-08-22', lastScribed: '2026-08-18' }
};

// Slots are an unattached pool (ADR 0006). Each carries a start, an end, and a
// deadline 72h before the start. n1 is another Game Master's date.
// Bare UTC instants, picked to read as evenings in the campaign's zone (as in 10).
const SLOTS = [
  { id: 's1', offeredBy: 'Aldous Finch', start: '2026-09-04T09:00:00Z', end: '2026-09-04T13:00:00Z' },
  { id: 's2', offeredBy: 'Aldous Finch', start: '2026-09-05T04:00:00Z', end: '2026-09-05T09:00:00Z' },
  { id: 's3', offeredBy: 'Aldous Finch', start: '2026-09-13T09:00:00Z', end: '2026-09-13T13:00:00Z' },
  { id: 's4', offeredBy: 'Aldous Finch', start: '2026-09-23T09:00:00Z', end: '2026-09-23T11:30:00Z' },
  { id: 'n1', offeredBy: 'Nia Osei',     start: '2026-09-12T04:00:00Z', end: '2026-09-12T09:00:00Z' }
];
SLOTS.forEach(s => { s.deadline = new Date(Date.parse(s.start) - 72 * 36e5).toISOString(); });

const QUESTS = [
  { id: 'q1', title: 'The Drowned Bell of Coldwater', proposedBy: 'Marta Vance', proposedAt: '2026-08-20',
    seats: 5, levels: [3, 5], candidates: ['s1', 's2', 's3', 'n1'], room: 47,
    blurb: 'Something has been ringing a bell under the ice at Coldwater since the spring. Two nights out, cold weather rules the whole way.' },
  { id: 'q2', title: 'Smoke over the Hollow Fields', proposedBy: 'Nia Osei', proposedAt: '2026-08-24',
    seats: 4, levels: [1, 3], candidates: ['s1', 's3', 'n1'], room: 12, byGameMaster: true,
    blurb: 'Three farms burned in a line, a day apart, walking north. Short one, back by dark.' },
  { id: 'q3', title: 'Bring the horses back', proposedBy: 'Sam Okafor', proposedAt: '2026-08-14',

/* =========================================================================
   STATE — confirmations are live and in memory. Reload to reset.
   ========================================================================= */

const params = new URLSearchParams(location.search);
const state = {
  variant: (params.get('variant') || 'A').toUpperCase(),
  when: params.get('when') === 'later' ? 'later' : 'now',
  width: params.get('w') === 'phone' ? 'phone' : 'desktop',
  open: params.get('open') || null,        // "questId:slotId" — the pairing being inspected
  confirmed: [],                            // [{quest, slot, party, waitlist, scribe}]
  dialog: null,                             // {quest, slot} being confirmed
  flash: null
};

const VARIANTS = { A: 'The Grid', B: 'By Date', C: 'By Quest' };

function push() {
  const p = new URLSearchParams();
  p.set('variant', state.variant);
  p.set('when', state.when);
  p.set('w', state.width);
  if (state.open) p.set('open', state.open);
  history.replaceState(null, '', '?' + p.toString());
}

const NOW = () => Date.parse(CLOCKS[state.when]);

/* =========================================================================
   THE RULE — ADR 0005. Order by bumps since your last seat (most first), then
   how long since that seat (never seated sorts as longest), then who declared
   first. Binding: there is no override anywhere in this file.
   ========================================================================= */

function rota(a, b) {
  const pa = PEOPLE[a.who], pb = PEOPLE[b.who];
  if (pa.bumps !== pb.bumps) return pb.bumps - pa.bumps;
  const av = pa.lastSeat ? Date.parse(pa.lastSeat) : -Infinity;
  const bv = pb.lastSeat ? Date.parse(pb.lastSeat) : -Infinity;
  if (av !== bv) return av - bv;
  return Date.parse(a.at) - Date.parse(b.at);
}

/* THE SCRIBE, derived not chosen. Ticket 07 names one scribe at confirmation but
   never says who picks; the Game Master picking was tried in this prototype and
   struck. The debt goes to whoever in the party has gone longest without writing
   one, never-scribed first, ties broken by rota position. Same shape as the rota:
   derivable from reports we already keep, binding, and checkable. INVENTED HERE. */
function scribeFor(o) {
  return o.party.slice().sort((a, b) => {
    const av = PEOPLE[a.who].lastScribed ? Date.parse(PEOPLE[a.who].lastScribed) : -Infinity;
    const bv = PEOPLE[b.who].lastScribed ? Date.parse(PEOPLE[b.who].lastScribed) : -Infinity;
    if (av !== bv) return av - bv;
    return o.party.indexOf(a) - o.party.indexOf(b);
  })[0];
}

function scribeWhy(who) {
  const last = PEOPLE[who].lastScribed;
  if (!last) return 'has never written one';
  const days = Math.round((NOW() - Date.parse(last)) / 864e5);
  return days < 28 ? 'last wrote one ' + days + ' days ago' : 'last wrote one ' + Math.round(days / 7) + ' weeks ago';
}

const slot = id => SLOTS.find(s => s.id === id);
const quest = id => QUESTS.find(q => q.id === id);

const spentSlots = () => new Set(state.confirmed.map(c => c.slot));
const confirmedQuests = () => new Set(state.confirmed.map(c => c.quest));

// Ticket 05: a character is never a candidate for a slot its own player offered.
const ownSlot = (interest, s) => PEOPLE[interest.who].player === s.offeredBy;

function interestsIn(questId) { return INTERESTS.filter(i => i.quest === questId); }

/* What the pairing (quest, slot) would produce. The whole decision aid. */
function outcome(questId, slotId) {
  const q = quest(questId), s = slot(slotId);
  const named = interestsIn(questId).filter(i => i.slots.includes(slotId));
  const excluded = named.filter(i => ownSlot(i, s));
  const runners = named.filter(i => !ownSlot(i, s)).sort(rota);
  const party = runners.slice(0, q.seats);
  const waitlist = runners.slice(q.seats);
  return {
    quest: q, slot: s, runners, party, waitlist, excluded,
    unfilled: Math.max(0, q.seats - party.length),
    // Everyone who declared on this quest but cannot make this date. Bumped if it is confirmed.
    absent: interestsIn(questId).filter(i => !i.slots.includes(slotId))
  };
}

/* Every quest still targeting a given slot, best party first. */
function contenders(slotId) {
  const done = confirmedQuests();
  return QUESTS
    .filter(q => q.candidates.includes(slotId) && !done.has(q.id))
    .map(q => outcome(q.id, slotId))
    .sort((a, b) => b.party.length - a.party.length || Date.parse(a.quest.proposedAt) - Date.parse(b.quest.proposedAt));
}

/* A slot's own gate, ADR 0005: no confirmation until its deadline has passed. */
function gate(s) {
  if (spentSlots().has(s.id)) return { state: 'spent', label: 'spent' };
  if (Date.parse(s.start) < NOW()) return { state: 'gone', label: 'gone by' };
  if (Date.parse(s.deadline) > NOW()) return { state: 'shut', label: 'interest closes ' + until(s.deadline) };
  if (s.offeredBy !== YOU) return { state: 'notmine', label: s.offeredBy + "'s date" };
  return { state: 'open', label: 'yours to confirm' };
}
const confirmable = s => gate(s).state === 'open';

/* The abandonment clock, ADR 0006: 14 days after the last moment anything could
   confirm this quest. Live candidate slots are the ones not spent and not gone. */
function abandonsIn(q) {
  const live = q.candidates.map(slot).filter(s => !spentSlots().has(s.id) && Date.parse(s.start) >= NOW());
  const last = live.length
    ? Math.max(...live.map(s => Date.parse(s.deadline)))
    : Math.max(...q.candidates.map(id => Date.parse(slot(id).deadline)), Date.parse(q.proposedAt));
  const days = Math.ceil((last + 14 * 864e5 - NOW()) / 864e5);
  return { days, stranded: live.length === 0 };
}

/* =========================================================================
   FORMATTING — instants formatted in the viewer's browser, and deliberately
   NO timezone label (ticket 04). The recency reason must never round (10).
   ========================================================================= */

const fDay  = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fDayL = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const fTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });

const day  = iso => fDay.format(new Date(iso));
const dayL = iso => fDayL.format(new Date(iso));
const span = s => fTime.format(new Date(s.start)) + '–' + fTime.format(new Date(s.end));
const hours = s => Math.round((Date.parse(s.end) - Date.parse(s.start)) / 36e5 * 10) / 10;

function until(iso) {
  const h = (Date.parse(iso) - NOW()) / 36e5;
  if (h < 0) return 'closed';
  if (h < 24) return 'in ' + Math.round(h) + (Math.round(h) === 1 ? ' hour' : ' hours');
  const d = Math.round(h / 24);
  return 'in ' + d + (d === 1 ? ' day' : ' days');
}

/* Exact days under four weeks, weeks beyond. Two identical reasons in different
   positions reads as favour, which is the failure the disclosure is guarding against. */
function why(who) {
  const p = PEOPLE[who];
  const bumps = p.bumps ? p.bumps + (p.bumps === 1 ? ' bump' : ' bumps') : null;
  let seat;
  if (!p.lastSeat) seat = 'never seated';
  else {
    const days = Math.round((NOW() - Date.parse(p.lastSeat)) / 864e5);
    seat = days < 28 ? days + 'd since a seat' : Math.round(days / 7) + 'w since a seat';
  }
  return bumps ? bumps + ' · ' + seat : seat;
}

function initials(name) { return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
function hue(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function avatar(i, cls = '') {
  return `<span class="avatar ${cls}" style="background: oklch(58% 0.14 ${hue(i.char)})" title="${esc(i.char)} — ${esc(PEOPLE[i.who].player)}">${initials(i.char)}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

/* How a pairing is priced, in parties rather than in headcount (10's column footer). */
function price(o) {
  if (!o.runners.length) return { headline: 'nobody', sub: 'no one who declared can make this date', tone: 'thin' };
  if (o.unfilled) return {
    headline: o.party.length + ' of ' + o.quest.seats,
    sub: plural(o.unfilled, 'seat') + ' unfilled',
    tone: 'thin'
  };
  return {
    headline: o.party.length + ' seated',
    sub: o.waitlist.length ? plural(o.waitlist.length, 'waiting') : 'exactly full',
    tone: 'full'
  };
}

/* =========================================================================
   SHARED FRAGMENTS
   ========================================================================= */

/* The rota, shown in full, with the reason on every row (ADR 0005: a binding
   cut has no appeal, so being checkable is the only accountability it has). */
function rotaList(o, opts = {}) {
  const rows = o.runners.map((i, n) => {
    const seated = n < o.quest.seats;
    return `<li class="${seated ? 'seated' : ''} ${seated && (n === o.quest.seats - 1 || n === o.runners.length - 1) ? 'cut' : ''}">
      <span class="n nums">${n + 1}</span>
      ${avatar(i, 'sm')}
      <span><span class="nm">${esc(i.char)}</span> <span class="pl">${esc(PEOPLE[i.who].player)}</span></span>
      <span class="why">${why(i.who)}</span>
    </li>`;
  });

  const gap = [];
  if (o.unfilled) {
    for (let k = 0; k < o.unfilled; k++) gap.push(`<li class="unfilled">${ord(o.runners.length + k + 1)} seat unfilled</li>`);
  }
  const cut = o.runners.length > o.quest.seats
    ? `<div class="cutline">the cut · ${plural(o.waitlist.length, 'on the waitlist')}</div>` : '';

  const seatedRows = rows.slice(0, o.quest.seats).join('');
  const waitRows = rows.slice(o.quest.seats).join('');

  const excluded = o.excluded.length ? `<p class="tiny dim" style="margin:0.6rem 0 0">
    ${o.excluded.map(i => esc(i.char)).join(', ')} can make this date but is not in the running for it —
    ${o.excluded.length === 1 ? 'that player' : 'those players'} offered it.</p>` : '';

  const absent = opts.absent !== false && o.absent.length ? `<p class="tiny dim" style="margin:0.4rem 0 0">
    ${plural(o.absent.length, 'other')} declared on this quest but cannot make this date:
    ${o.absent.map(i => esc(i.char)).join(', ')}. Confirming here bumps ${o.absent.length === 1 ? 'them' : 'them all'}
    up the rota for next time.</p>` : '';

  return `<ul class="rota">${seatedRows}${gap.join('')}</ul>${cut}<ul class="rota">${waitRows}</ul>${excluded}${absent}`;
}

function faces(list, cls = '') {
  return `<span class="faces">${list.map(i => avatar(i, 'sm ' + cls)).join('')}</span>`;
}

function gatePill(s) {
  const g = gate(s);
  const cls = { open: 'open', shut: 'shut', spent: 'wait', gone: 'wait', notmine: 'wait' }[g.state];
  return `<span class="pill ${cls}">${esc(g.label)}</span>`;
}

/* The one thing this screen must not let a Game Master mistake for a suggestion. */
function bindingNote() {
  return `<p class="tiny dim" style="margin:0.75rem 0 0;max-inline-size:44rem">
    You choose the date. The rota cuts the party, and you cannot change it — a different
    party means a different date, or another date offered.</p>`;
}

/* =========================================================================
   VARIANT A — THE GRID
   My dates down the side, the quests targeting them across the top, and in each
   cell the party that pairing would produce. Picking a cell opens the rota under
   the table. This is 10's variant A pushed into ADR 0006's second axis.
   ========================================================================= */

function renderA() {
  const mine = SLOTS.filter(s => s.offeredBy === YOU);
  const done = confirmedQuests();
  const live = QUESTS.filter(q => !done.has(q.id));

  const head = live.map(q => `<th>
    <span class="q">${esc(q.title)}</span>
    <span class="qm">${plural(interestsIn(q.id).length, 'interested')} · ${q.seats} seats</span>
  </th>`).join('');

  const rows = mine.map(s => {
    const g = gate(s);
    const cells = live.map(q => {
      if (!q.candidates.includes(s.id)) return `<td><span class="pairing dead">·</span></td>`;
      const o = outcome(q.id, s.id);
      const p = price(o);
      const key = q.id + ':' + s.id;
      return `<td><button class="pairing ${p.tone}" data-pair="${key}" aria-pressed="${state.open === key}">
        <span class="headline">${p.headline}</span>
        <span class="sub">${p.sub}</span>
      </button></td>`;
    }).join('');

    return `<tr class="${g.state === 'shut' ? 'shut' : ''} ${g.state === 'spent' || g.state === 'gone' ? 'spent' : ''}">
      <th class="when">
        <span class="whenblock">
          <span class="d">${day(s.start)}</span>
          <span class="t">${span(s)}</span>
          ${gatePill(s)}
        </span>
      </th>${cells}</tr>`;
  }).join('');

  const other = SLOTS.filter(s => s.offeredBy !== YOU);
  const otherNote = other.length ? `<p class="tiny dim" style="margin-block-start:0.75rem">
    Not shown: ${plural(other.length, 'date')} offered by another Game Master that these quests
    are also targeting — ${other.map(s => day(s.start) + ' (' + esc(s.offeredBy) + ')').join(', ')}.
    You cannot confirm into ${other.length === 1 ? 'it' : 'them'}, but ${other.length === 1 ? 'it is' : 'they are'}
    a reason a quest may not need your date.</p>` : '';

  return `${flash()}
    <div class="pagehead"><h1>Your dates</h1></div>
    <p class="pagesub">Every quest pointed at a date you offered, and the party each pairing would
      produce. Confirming one spends that date for all the others.</p>
    <div class="gridwrap"><table class="board">
      <thead><tr><th class="when"></th>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${otherNote}
    ${bindingNote()}
    ${drawer()}`;
}

function drawer() {
  if (!state.open) return '';
  const [qid, sid] = state.open.split(':');
  const o = outcome(qid, sid);
  const g = gate(o.slot);
  return `<div class="drawer">
    <header>
      <div>
        <h3>${esc(o.quest.title)}</h3>
        <div class="small dim">on ${dayL(o.slot.start)}, ${span(o.slot)} · about ${hours(o.slot)} hours</div>
      </div>
      <div class="spacer"></div>
      ${confirmAction(o, g)}
    </header>
    ${rotaList(o)}
  </div>`;
}

function confirmAction(o, g) {
  if (g.state === 'open') {
    return `<button class="btn primary" data-confirm="${o.quest.id}:${o.slot.id}">Confirm into ${day(o.slot.start)}</button>`;
  }
  const excuse = {
    shut: 'Interest is still open — nothing can be confirmed into this date until ' + until(o.slot.deadline).replace('in ', 'it closes, in ') + '.',
    spent: 'This date is spent.',
    gone: 'This date has passed.',
    notmine: 'This is ' + o.slot.offeredBy + "'s date. Only they can confirm into it."
  }[g.state];
  return `<div style="max-inline-size:20rem">
    <button class="btn" disabled>Confirm</button>
    <div class="tiny dim" style="margin-block-start:0.35rem">${esc(excuse)}</div>
  </div>`;
}

function flash() {
  if (!state.flash) return '';
  return `<div class="done">${state.flash}</div>`;
}

/* =========================================================================
   VARIANT B — BY DATE
   One card per date I offered; inside it, the quests competing for it side by
   side. The date is the object: "I have Friday free, what am I running?"
   ========================================================================= */

function renderB() {
  const mine = SLOTS.filter(s => s.offeredBy === YOU).sort((a, b) => Date.parse(a.start) - Date.parse(b.start));

  const cards = mine.map(s => {
    const g = gate(s);
    const cs = contenders(s.id);
    const held = state.confirmed.find(c => c.slot === s.id);

    let body;
    if (held) {
      const o = outcome(held.quest, held.slot);
      body = `<div class="contenders"><div class="contender leading">
        <h4>${esc(quest(held.quest).title)}</h4>
        <div class="verdict full">Confirmed · ${plural(o.party.length, 'seat')} taken</div>
        ${faces(o.party)}
        <div class="tiny dim">Scribe: ${esc(held.scribe)}. Nobody else can have this date now.</div>
      </div></div>`;
    } else if (!cs.length) {
      body = `<div class="emptydate">No quest is pointed at this date yet. It sits in the pool until one is.</div>`;
    } else {
      body = `<div class="contenders ${cs.length > 1 ? 'multi' : ''}">${cs.map(o => {
        const p = price(o);
        const key = o.quest.id + ':' + s.id;
        const orphan = o.quest.candidates.filter(id => !spentSlots().has(id) && Date.parse(slot(id).start) >= NOW()).length === 1;
        return `<div class="contender">
          <div>
            <h4>${esc(o.quest.title)}</h4>
            <div class="by">${o.quest.byGameMaster ? 'offered by' : 'proposed by'} ${esc(o.quest.proposedBy)} ·
              ${plural(interestsIn(o.quest.id).length, 'interested')}</div>
          </div>
          <div class="verdict ${p.tone}">${p.headline} <span class="dim" style="font-weight:400">· ${p.sub}</span></div>
          ${faces(o.party)}
          ${orphan ? `<div class="tiny" style="color:var(--color-alert)">This is its only live date.</div>` : ''}
          <div class="foot">
            <button class="btn small" data-pair="${key}" aria-pressed="${state.open === key}">
              ${state.open === key ? 'Hide the rota' : 'Show the rota'}</button>
            ${g.state === 'open'
              ? `<button class="btn small primary" data-confirm="${key}">Run this one</button>`
              : ''}
          </div>
          ${state.open === key ? `<div style="border-block-start:1px solid var(--color-border);padding-block-start:0.6rem">${rotaList(o)}</div>` : ''}
        </div>`;
      }).join('')}</div>`;
    }

    return `<article class="datecard ${g.state === 'shut' ? 'shut' : ''} ${['spent','gone'].includes(g.state) ? 'spent' : ''}">
      <header>
        <span class="date">${dayL(s.start)}</span>
        <span class="time">${span(s)} · about ${hours(s)} hours</span>
        <span class="spacer"></span>
        ${gatePill(s)}
      </header>
      ${g.state === 'shut' ? `<div class="tiny dim" style="padding:0.6rem 1rem 0">
        Interest closes 72 hours before you start, ${until(s.deadline)}. Nothing can be confirmed
        into this date until it does — the parties below will still move.</div>` : ''}
      ${body}
    </article>`;
  }).join('');

  return `${flash()}
    <div class="pagehead"><h1>Your dates</h1></div>
    <p class="pagesub">Four dates on offer. Under each one, the quests that want it and the party
      each would produce. Taking one spends the date for the rest.</p>
    ${cards}
    ${bindingNote()}`;
}

/* =========================================================================
   VARIANT C — BY QUEST
   One card per quest waiting on me; inside it, the dates it could run on. The
   quest is the object: "this has been on the board three weeks — when?"
   ========================================================================= */

function renderC() {
  const done = confirmedQuests();
  const live = QUESTS.filter(q => !done.has(q.id))
    .sort((a, b) => abandonsIn(a).days - abandonsIn(b).days);

  const cards = live.map(q => {
    const clock = abandonsIn(q);
    const rows = q.candidates.map(id => {
      const s = slot(id);
      const g = gate(s);
      const o = outcome(q.id, id);
      const p = price(o);
      const key = q.id + ':' + id;
      const rival = contenders(id).filter(c => c.quest.id !== q.id);
      return `<div class="optionrow ${s.offeredBy !== YOU ? 'notmine' : ''}">
        <span class="when">${day(s.start)}<small>${span(s)}</small></span>
        <span class="out ${p.tone}">${p.headline}<span class="dim" style="font-weight:400"> · ${p.sub}</span></span>
        ${rival.length ? `<span class="tiny dim">${plural(rival.length, 'other quest')} want${rival.length === 1 ? 's' : ''} this date</span>` : ''}
        <span class="spacer"></span>
        ${gatePill(s)}
        <button class="btn small" data-pair="${key}" aria-pressed="${state.open === key}">${state.open === key ? 'Hide' : 'Rota'}</button>
        ${g.state === 'open' ? `<button class="btn small primary" data-confirm="${key}">Confirm</button>` : ''}
        ${state.open === key ? `<div style="flex-basis:100%;padding-block-start:0.5rem">${rotaList(o)}</div>` : ''}
      </div>`;
    }).join('');

    return `<article class="questcard">
      <header>
        <div class="t">${esc(q.title)}</div>
        <div class="by">${q.byGameMaster ? 'offered by' : 'proposed by'} ${esc(q.proposedBy)} ·
          levels ${q.levels[0]}–${q.levels[1]} · ${q.seats} seats ·
          ${plural(interestsIn(q.id).length, 'interested')} · ${q.room} messages</div>
        <div class="clock" style="margin-block-start:0.35rem">
          ${clock.stranded
            ? 'No live date left. Abandoned in ' + plural(clock.days, 'day') + ' unless someone offers one.'
            : 'Abandoned in ' + plural(clock.days, 'day') + ' if nothing confirms it.'}</div>
      </header>
      ${rows}
    </article>`;
  }).join('');

  return `${flash()}
    <div class="pagehead"><h1>Quests waiting on a date</h1></div>
    <p class="pagesub">Every open quest with a candidate date, soonest to die first. Under each,
      the dates it could run on and the party each would produce.</p>
    ${cards}
    ${bindingNote()}`;
}

/* =========================================================================
   THE MOMENT OF CONFIRMATION — what it visibly spends
   ========================================================================= */

function renderDialog() {
  const veil = document.getElementById('veil');
  if (!state.dialog) { veil.hidden = true; veil.innerHTML = ''; return; }

  const [qid, sid] = state.dialog.split(':');
  const o = outcome(qid, sid);
  const losers = contenders(sid).filter(c => c.quest.id !== qid);

  const spend = [];
  spend.push(`<div class="line"><span class="g">&#128197;</span>
    <span><strong>${dayL(o.slot.start)}, ${span(o.slot)}</strong> is spent. It leaves the pool for good,
    even if you cancel later.</span></div>`);
  spend.push(`<div class="line"><span class="g">&#9989;</span>
    <span><strong>${plural(o.party.length, 'character')}</strong> take a seat: ${o.party.map(i => esc(i.char)).join(', ')}.
    ${o.unfilled ? plural(o.unfilled, 'seat') + ' stay unfilled.' : ''}</span></div>`);
  if (o.waitlist.length) spend.push(`<div class="line"><span class="g">&#8942;</span>
    <span><strong>${plural(o.waitlist.length, 'character')}</strong> go on the waitlist in this order —
    ${o.waitlist.map(i => esc(i.char)).join(', ')} — and it is frozen there. A freed seat goes to the
    first of them automatically, at any hour.</span></div>`);
  spend.push(`<div class="line"><span class="g">&#9998;</span>
    <span><strong>${esc(scribeFor(o).char)}</strong> owes the report — ${scribeWhy(scribeFor(o).who)},
    the longest of anyone seated. Not your choice and not theirs; you cannot write it and you
    cannot correct it.</span></div>`);
  if (o.absent.length) spend.push(`<div class="line"><span class="g">&#8593;</span>
    <span><strong>${plural(o.absent.length, 'declarer')}</strong> could not make this date and
    ${o.absent.length === 1 ? 'is' : 'are'} bumped: ${o.absent.map(i => esc(i.char)).join(', ')}.
    ${o.absent.length === 1 ? 'They rise' : 'They rise'} up the rota for the next quest.</span></div>`);

  losers.forEach(l => {
    const liveLeft = l.quest.candidates.filter(id => id !== sid && !spentSlots().has(id) && Date.parse(slot(id).start) >= NOW());
    spend.push(`<div class="line ${liveLeft.length ? '' : 'bad'}"><span class="g">&#10006;</span>
      <span><strong>${esc(l.quest.title)}</strong> loses this date.
      ${liveLeft.length
        ? 'It still has ' + plural(liveLeft.length, 'other date') + ' — ' + liveLeft.map(id => day(slot(id).start)).join(', ') + '.'
        : 'It has no other date. It goes back to waiting for one, and the clock takes it in ' + plural(abandonsIn(l.quest).days, 'day') + '.'}
      Nobody on it is bumped — losing the date is not being refused.</span></div>`);
  });

  const scribe = scribeFor(o);

  veil.hidden = false;
  veil.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
    <h2>Run ${esc(o.quest.title)} on ${day(o.slot.start)}?</h2>
    <p class="lede">This is the moment the quest becomes real. Here is what it spends.</p>
    <div class="spend">${spend.join('')}</div>
    <div class="acts">
      <button class="btn" data-close="1">Not yet</button>
      <button class="btn primary" data-do="${state.dialog}">Confirm</button>
    </div>
  </div>`;
}

function doConfirm(key) {
  const [qid, sid] = key.split(':');
  const o = outcome(qid, sid);
  state.confirmed.push({
    quest: qid, slot: sid, scribe: scribeFor(o).char,
    party: o.party.map(i => i.char), waitlist: o.waitlist.map(i => i.char)
  });
  const losers = contenders(sid).filter(c => c.quest.id !== qid).map(c => c.quest.title);
  state.flash = `<strong>${esc(o.quest.title)} is confirmed into ${dayL(o.slot.start)}.</strong>
    ${plural(o.party.length, 'seat')} cut by the rota, ${esc(scribeFor(o).char)} owes the report.
    ${losers.length ? esc(losers.join(' and ')) + ' lost the date.' : ''}
    <span class="dim">Everyone interested hears about it — which events, and how loudly, is ticket 09's.</span>`;
  state.dialog = null; state.open = null;
}

/* =========================================================================
   CHROME + SWITCHER
   ========================================================================= */

function renderChrome() {
  document.getElementById('sidebar').innerHTML = `
    <div style="font-weight:700;padding:0 0.5rem 0.5rem">The Ash Marches</div>
    <h4>Campaign</h4>
    ${SIDEBAR.filter(r => r.kind === 'campaign').map(r => `<a href="#" class="${r.unread ? 'unread' : ''}">${esc(r.name)}</a>`).join('')}
    <h4>Quests</h4>
    ${SIDEBAR.filter(r => r.kind !== 'campaign').map(r => `
      <a href="#" class="${r.unread ? 'unread' : ''}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
        <span class="when">${r.when}</span></a>`).join('')}
    <h4>You run</h4>
    <a href="#" class="current"><span>Your dates</span><span class="when">${SLOTS.filter(s => s.offeredBy === YOU && !spentSlots().has(s.id)).length}</span></a>
    <p class="tiny dim" style="padding:0.75rem 0.5rem">Live quests only, soonest date first. Finished quests are reached from the quest itself.</p>`;

  document.getElementById('topbar').innerHTML = `
    <a class="back" href="#">&larr;</a>
    <span class="crumb">${esc(YOU)}</span>
    <span class="crumb">/ the dates you have offered</span>
    <span style="margin-inline-start:auto" class="pill">today is ${day(CLOCKS[state.when])}</span>`;
}

function render() {
  document.getElementById('frame').className = state.width === 'phone' ? 'phone' : '';
  renderChrome();
  document.getElementById('main').innerHTML =
    state.variant === 'B' ? renderB() : state.variant === 'C' ? renderC() : renderA();
  renderDialog();
  renderSwitcher();
  push();
}

function renderSwitcher() {
  document.getElementById('switcher').innerHTML = `
    <div class="bar">
      <button data-cycle="-1" aria-label="previous variant">&larr;</button>
      <span class="label">${state.variant} &middot; ${VARIANTS[state.variant]}</span>
      <button data-cycle="1" aria-label="next variant">&rarr;</button>
      <span class="sep"></span>
      <span class="grp"><em>clock</em>
        <button data-when="now" aria-pressed="${state.when === 'now'}">2 Sep</button>
        <button data-when="later" aria-pressed="${state.when === 'later'}">10 Sep</button>
      </span>
      <span class="sep"></span>
      <span class="grp"><em>width</em>
        <button data-width="desktop" aria-pressed="${state.width === 'desktop'}">desktop</button>
        <button data-width="phone" aria-pressed="${state.width === 'phone'}">phone</button>
      </span>
    </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cycle],[data-when],[data-width],[data-pair],[data-confirm],[data-do],[data-close]');
  if (!t) {
    if (state.dialog && e.target.id === 'veil') { state.dialog = null; render(); }
    return;
  }
  e.preventDefault();
  const keys = Object.keys(VARIANTS);

  if (t.dataset.cycle) {
    const i = keys.indexOf(state.variant);
    state.variant = keys[(i + Number(t.dataset.cycle) + keys.length) % keys.length];
    state.open = null;
  } else if (t.dataset.when) {
    state.when = t.dataset.when;
  } else if (t.dataset.width) {
    state.width = t.dataset.width;
  } else if (t.dataset.pair) {
    state.open = state.open === t.dataset.pair ? null : t.dataset.pair;
  } else if (t.dataset.confirm) {
    state.dialog = t.dataset.confirm;
    state.flash = null;
  } else if (t.dataset.do) {
    doConfirm(t.dataset.do);
  } else if (t.dataset.close) {
    state.dialog = null;
  }
  render();
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'Escape' && state.dialog) { state.dialog = null; return render(); }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(state.variant);
  state.variant = keys[(i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length];
  state.open = null;
  render();
});

render();
</script>
</body>
</html>
