<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — the quest page (ticket 10)</title>
<!--
  THROWAWAY PROTOTYPE. Ticket 10, .scratch/west-marches-platform/issues/10-prototype-quest-page.md
  Not wired to Rails. Nothing here is feature code. Delete when the ticket resolves.

  Plan: three structurally different variants of a proposed quest's page as an interested
  player sees it, switchable via ?variant=A|B|C, plus ?declared=0|1 and ?w=desktop|phone,
  all driven from the floating bar at the bottom.

    A  The Board     — the availability matrix, rows in priority order, cut line visible
    B  Four Dates    — matrix transposed into a stack of slot cards; no grid anywhere
    C  You First     — your declaration leads; the roster is hidden behind a disclosure

  Fake data is the ticket's stress case: 8 interested characters x 4 candidate slots.
  Times are bare UTC instants rendered in the browser with no zone label (ticket 04).
-->
<style>
:root {
  --lch-black: 0% 0 0; --lch-white: 100% 0 0;
  --lch-gray: 96% 0.005 96; --lch-gray-dark: 92% 0.005 96; --lch-gray-darker: 75% 0.005 96;
  --lch-blue: 54% 0.23 255; --lch-blue-light: 95% 0.03 255; --lch-blue-dark: 80% 0.08 255;
  --lch-orange: 70% 0.2 44; --lch-red: 51% 0.2 31; --lch-green: 55% 0.16 150;

  --color-bg: oklch(var(--lch-white));
  --color-panel: oklch(var(--lch-gray));
  --color-text: oklch(var(--lch-black));
  --color-dim: oklch(from oklch(var(--lch-black)) l c h / 0.55);
  --color-fainter: oklch(from oklch(var(--lch-black)) l c h / 0.30);
  --color-link: oklch(var(--lch-blue));
  --color-border: oklch(var(--lch-gray-dark));
  --color-border-darker: oklch(var(--lch-gray-darker));
  --color-selected: oklch(var(--lch-blue-light));
  --color-alert: oklch(var(--lch-orange));
  --color-seat: oklch(var(--lch-green));
  --color-seat-bg: oklch(from oklch(var(--lch-green)) l c h / 0.12);

  --font-family: -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;

  @media (prefers-color-scheme: dark) {
    --lch-black: 100% 0 0; --lch-white: 0% 0 0;
    --lch-gray: 25.2% 0 0; --lch-gray-dark: 30.12% 0 0; --lch-gray-darker: 44.95% 0 0;
    --lch-blue: 72.25% 0.16 248; --lch-blue-light: 28.11% 0.053 248;
    --lch-red: 73.8% 0.184 29.18; --lch-green: 75% 0.21 141.89;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-family); line-height: 1.4;
  padding-block-end: 6rem;
}
a { color: var(--color-link); }
h1, h2, h3 { margin: 0; line-height: 1.15; }
button { font: inherit; }

/* ---------- app chrome (shared; the variants only own #main) ---------- */

#frame { margin-inline: auto; }
#frame.phone {
  inline-size: 390px; margin-block: 1rem;
  border: 10px solid var(--color-border-darker); border-radius: 28px;
  overflow: hidden; box-shadow: 0 1rem 3rem oklch(0% 0 0 / 0.25);
}
#app { container-type: inline-size; container-name: app; background: var(--color-bg); }

#chrome { display: grid; grid-template-columns: 1fr; }
@container app (min-width: 860px) { #chrome { grid-template-columns: 17rem 1fr; } }

#sidebar {
  border-inline-end: 1px solid var(--color-border);
  padding: 1rem 0.75rem; font-size: 0.875rem;
  block-size: 100dvh; position: sticky; inset-block-start: 0; overflow-y: auto;
}
@container app (max-width: 859px) { #sidebar { display: none; } }
#sidebar h4 {
  margin: 1.25rem 0 0.4rem; font-size: 0.6875rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--color-dim);
}
#sidebar a {
  display: flex; gap: 0.5rem; align-items: baseline;
  padding: 0.35rem 0.5rem; border-radius: 0.4rem;
  color: inherit; text-decoration: none;
}
#sidebar a.current { background: var(--color-selected); font-weight: 600; }
#sidebar a .when { margin-inline-start: auto; color: var(--color-dim); font-size: 0.75rem; }
#sidebar a.unread { font-weight: 600; }

#topbar {
  display: flex; gap: 0.75rem; align-items: center;
  padding: 0.75rem 1rem; border-block-end: 1px solid var(--color-border);
  position: sticky; inset-block-start: 0; background: var(--color-bg); z-index: 5;
}
#topbar .back { text-decoration: none; color: var(--color-dim); }
#topbar .crumb { font-size: 0.875rem; color: var(--color-dim); }

#main { padding: 1.25rem 1rem 2rem; max-inline-size: 62rem; }
@container app (min-width: 860px) { #main { padding: 2rem 2.5rem 4rem; } }

/* ---------- shared atoms ---------- */

.avatar {
  inline-size: 1.75rem; block-size: 1.75rem; border-radius: 50%;
  display: inline-grid; place-items: center; flex: none;
  font-size: 0.6875rem; font-weight: 700; color: #fff; letter-spacing: 0.02em;
}
.avatar.lg { inline-size: 2.25rem; block-size: 2.25rem; font-size: 0.8125rem; }
.avatar.sm { inline-size: 1.375rem; block-size: 1.375rem; font-size: 0.5625rem; }

.pill {
  display: inline-flex; gap: 0.3rem; align-items: center;
  padding: 0.15rem 0.55rem; border-radius: 999px;
  font-size: 0.75rem; background: var(--color-panel); color: var(--color-dim);
  white-space: nowrap;
}
.pill.seat { background: var(--color-seat-bg); color: var(--color-seat); font-weight: 600; }
.pill.wait { background: var(--color-panel); color: var(--color-dim); font-weight: 600; }
.pill.warn { background: oklch(from var(--color-alert) l c h / 0.16); color: var(--color-alert); font-weight: 600; }

.dim { color: var(--color-dim); }
.small { font-size: 0.8125rem; }
.tiny { font-size: 0.75rem; }

.btn {
  border: 1px solid var(--color-border-darker); background: transparent; color: inherit;
  border-radius: 0.5rem; padding: 0.5rem 0.9rem; cursor: pointer;
}
.btn.primary { background: var(--color-link); border-color: var(--color-link); color: #fff; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.card {
  border: 1px solid var(--color-border); border-radius: 0.75rem;
  padding: 1rem; background: var(--color-bg);
}

.advisory {
  display: flex; gap: 0.6rem; align-items: flex-start;
  border: 1px solid var(--color-alert); border-radius: 0.6rem;
  background: oklch(from var(--color-alert) l c h / 0.08);
  padding: 0.6rem 0.75rem; font-size: 0.8125rem; margin-block-start: 0.75rem;
}
.advisory .mark { color: var(--color-alert); font-weight: 700; }

.roomlink {
  display: flex; gap: 0.75rem; align-items: center; text-decoration: none; color: inherit;
  border: 1px solid var(--color-border); border-radius: 0.75rem; padding: 0.85rem 1rem;
}
.roomlink:hover { border-color: var(--color-border-darker); }
.roomlink .glyph { font-size: 1.25rem; }
.roomlink .arrow { margin-inline-start: auto; color: var(--color-dim); }

.slotchip {
  display: flex; flex-direction: column; gap: 0.1rem; align-items: flex-start;
  border: 1px solid var(--color-border-darker); border-radius: 0.6rem;
  padding: 0.5rem 0.7rem; cursor: pointer; background: transparent; color: inherit;
  text-align: start; min-inline-size: 7.5rem;
}
.slotchip[aria-pressed="true"] {
  border-color: var(--color-link); background: var(--color-selected);
  box-shadow: inset 0 0 0 1px var(--color-link);
}
.slotchip .d { font-weight: 600; }
.slotchip .t { font-size: 0.75rem; color: var(--color-dim); }

/* ---------- A: the board ---------- */

.matrixwrap { margin-block: 1.25rem; overflow-x: auto; }
table.matrix { border-collapse: collapse; inline-size: 100%; max-inline-size: 46rem; }
table.matrix th, table.matrix td { padding: 0.4rem 0.3rem; text-align: center; }
table.matrix thead th {
  vertical-align: bottom; font-size: 0.75rem; font-weight: 600; line-height: 1.25;
  border-block-end: 1px solid var(--color-border-darker); padding-block-end: 0.5rem;
}
table.matrix thead th .t { display: block; font-weight: 400; color: var(--color-dim); font-size: 0.6875rem; }
table.matrix thead th .tshort { display: none; font-weight: 400; color: var(--color-dim); font-size: 0.6875rem; }
table.matrix thead th .n { display: block; font-weight: 400; color: var(--color-dim); font-size: 0.6875rem; margin-block-start: 0.15rem; }
table.matrix thead th .wd, table.matrix thead th .dt { white-space: nowrap; }
table.matrix th.who, table.matrix tfoot td.who {
  text-align: start; inline-size: 100%; padding-inline-start: 0;
  position: sticky; inset-inline-start: 0; background: var(--color-bg);
}
table.matrix tbody tr { border-block-end: 1px solid var(--color-border); }
table.matrix tbody tr.me th.who, table.matrix tbody tr.me td { background: var(--color-selected); }
table.matrix tbody tr.me th.who { box-shadow: inset 3px 0 0 var(--color-link); }
.who-inner { display: flex; gap: 0.5rem; align-items: center; padding: 0.35rem 0.5rem 0.35rem 0.4rem; }
.who-rank { inline-size: 1.25rem; text-align: end; color: var(--color-fainter); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.who-name { font-size: 0.8125rem; font-weight: 600; line-height: 1.2; }
.who-sub { font-size: 0.6875rem; color: var(--color-dim); }
@container app (max-width: 700px) { .who-sub .player { display: none; } }

/* the matrix at phone width: 4 slot columns must survive without sideways scroll */
@container app (max-width: 560px) {
  table.matrix thead th { font-size: 0.6875rem; }
  table.matrix thead th .wd, table.matrix thead th .dt { display: block; }
  table.matrix thead th .t { display: none; }
  table.matrix thead th .tshort { display: block; }
  table.matrix th, table.matrix td { padding-inline: 0.15rem; }
  .cell { inline-size: 3rem; }
  .who-inner { gap: 0.35rem; padding-inline: 0.15rem; }
  .who-inner .avatar { display: none; }
  .who-name { font-size: 0.75rem; }
  .who-sub { font-size: 0.625rem; }
  .dot { inline-size: 1rem; block-size: 1rem; }
  table.matrix tfoot td { font-size: 0.625rem; }
  .who-name, .who-sub { display: block; }
  .standing li { flex-wrap: wrap; }
  .standing li .d { min-inline-size: 5.5rem; }
  .legend { row-gap: 0.35rem; }
}

.cell { inline-size: 3.25rem; }
.dot {
  inline-size: 1.15rem; block-size: 1.15rem; border-radius: 50%; display: inline-block;
}
.dot.seated { background: var(--color-seat); }
.dot.waiting { border: 2px solid var(--color-border-darker); }
.dot.none { border: none; background: none; color: var(--color-fainter); }
td.cut { box-shadow: inset 0 -2px 0 var(--color-seat); }
table.matrix tfoot td { font-size: 0.6875rem; color: var(--color-dim); padding-block-start: 0.6rem; line-height: 1.25; }
table.matrix tfoot td strong { display: block; color: var(--color-text); font-size: 0.75rem; }

.mycell { padding: 0 !important; }
.mytoggle {
  inline-size: 100%; block-size: 2.6rem; border: none; background: transparent;
  cursor: pointer; display: grid; place-items: center;
}
.mytoggle:hover { background: oklch(from var(--color-link) l c h / 0.12); }

.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--color-dim); }
.legend span { display: inline-flex; gap: 0.35rem; align-items: center; }

/* ---------- B: four dates ---------- */

.slotcard { border: 1px solid var(--color-border); border-radius: 0.75rem; padding: 0; overflow: hidden; }
.slotcard + .slotcard { margin-block-start: 0.75rem; }
.slotcard.mine { border-color: var(--color-link); }
.slotcard header {
  display: flex; gap: 0.75rem; align-items: flex-start;
  padding: 0.9rem 1rem 0.75rem;
}
.slotcard .date { font-size: 1.0625rem; font-weight: 700; }
.slotcard .time { font-size: 0.8125rem; color: var(--color-dim); }
.slotcard .count { margin-inline-start: auto; text-align: end; font-size: 0.75rem; color: var(--color-dim); }
.slotcard .count b { display: block; font-size: 1.25rem; color: var(--color-text); line-height: 1; }
.seatrow { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0 1rem 0.75rem; }
.seatchip {
  display: inline-flex; gap: 0.35rem; align-items: center;
  border-radius: 999px; padding: 0.2rem 0.55rem 0.2rem 0.2rem;
  font-size: 0.75rem; background: var(--color-seat-bg);
}
.seatchip.waiting { background: var(--color-panel); color: var(--color-dim); }
.seatchip.you { outline: 2px solid var(--color-link); }
.seatchip .rank { font-variant-numeric: tabular-nums; color: var(--color-dim); font-size: 0.6875rem; }
.slotcard .verdict {
  display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
  padding: 0.65rem 1rem; border-block-start: 1px solid var(--color-border);
  background: var(--color-panel); font-size: 0.8125rem;
}
.slotcard .verdict .spacer { margin-inline-start: auto; }
.waitlabel { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-dim); padding: 0 1rem 0.25rem; }

/* ---------- C: you first ---------- */

.twocol { display: grid; gap: 1.5rem; }
@container app (min-width: 860px) { .twocol { grid-template-columns: 1fr 20rem; } }
.heat { display: grid; gap: 0.4rem; }
.heatrow { display: grid; grid-template-columns: 8.5rem 1fr 2.5rem; gap: 0.6rem; align-items: center; font-size: 0.8125rem; }
.heatbar { block-size: 0.6rem; border-radius: 999px; background: var(--color-panel); overflow: hidden; }
.heatbar i { display: block; block-size: 100%; background: var(--color-border-darker); }
.heatrow.yours .heatbar i { background: var(--color-link); }
.heatrow .n { text-align: end; color: var(--color-dim); font-variant-numeric: tabular-nums; }
details.roster > summary { cursor: pointer; padding: 0.6rem 0; font-size: 0.875rem; }
.rosterlist { display: grid; gap: 0.5rem; padding-block-start: 0.5rem; }
.rosterlist .row { display: flex; gap: 0.6rem; align-items: center; font-size: 0.8125rem; }
.rosterlist .row .when { margin-inline-start: auto; color: var(--color-dim); font-size: 0.75rem; }

.standing {
  border: 1px solid var(--color-border-darker); border-radius: 0.75rem;
  padding: 1rem; background: var(--color-panel);
}
.standing .headline { font-size: 1.0625rem; font-weight: 700; line-height: 1.25; }
.standing ul { margin: 0.75rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; font-size: 0.8125rem; }
.standing li { display: flex; gap: 0.5rem; align-items: center; }
.standing li .d { min-inline-size: 7rem; }

/* ---------- prototype switcher (not part of the design) ---------- */

#switcher {
  position: fixed; inset-block-end: 1rem; inset-inline: 0; z-index: 50;
  display: flex; justify-content: center; pointer-events: none;
}
#switcher .bar {
  pointer-events: auto; display: flex; gap: 0.5rem; align-items: center;
  background: oklch(20% 0 0); color: #fff; border-radius: 999px;
  padding: 0.4rem 0.5rem; box-shadow: 0 0.5rem 1.5rem oklch(0% 0 0 / 0.35);
  font-size: 0.8125rem; flex-wrap: wrap; max-inline-size: calc(100vw - 2rem);
}
#switcher button {
  background: oklch(100% 0 0 / 0.12); color: #fff; border: none; cursor: pointer;
  border-radius: 999px; padding: 0.3rem 0.7rem;
}
#switcher button[aria-pressed="true"] { background: #fff; color: #000; font-weight: 600; }
#switcher .label { padding-inline: 0.6rem; font-weight: 600; white-space: nowrap; }
#switcher .sep { inline-size: 1px; align-self: stretch; background: oklch(100% 0 0 / 0.2); }
#switcher .grp { display: flex; gap: 0.25rem; align-items: center; }
#switcher .grp em { font-style: normal; opacity: 0.6; padding-inline-end: 0.2rem; }
</style>

<body>
<div id="frame"><div id="app">
  <div id="chrome">
    <nav id="sidebar"></nav>
    <div>
      <div id="topbar"></div>
      <main id="main"></main>
    </div>
  </div>
</div></div>
<div id="switcher"></div>
<script>
/* =========================================================================
   FAKE DATA — the ticket's stress case: 8 interested characters x 4 slots.
   ========================================================================= */

const TODAY = new Date('2026-08-26T00:00:00Z');

const QUEST = {
  title: 'The Drowned Bell of Coldwater',
  proposedBy: 'Marta Vance',
  proposedAt: '2026-08-20T00:00:00Z',
  levelRange: [3, 5],
  seats: 5,
  followsFrom: 'The Salt Road Caravan',
  gameMaster: 'Aldous Finch',
  interestCloses: '2026-08-31T09:00:00Z',   // INVENTED. See findings — ticket 15 owns this.
  blurb: 'Three seasons ago the Salt Road party heard a bell under the ice at Coldwater and did not stop to look. It has been ringing since, on the hour, loud enough to hear from the ridge.',
  body: 'The plan is to go up the Coldwater valley on foot, camp on the ridge the caravan used, and go down onto the ice at first light to find where the bell is hanging. Whatever is ringing it is doing so deliberately.\n\nI want people who can swim and at least one who can read Old Marcher — the caravan report mentions cut stone under the shelf ice, and I would rather not guess at what it says. Expect two nights out and cold weather rules the whole way.',
  room: { messages: 47, lastFrom: 'Nia Osei', lastAgo: '2h ago' }
};

const SLOTS = [
  // Bare UTC instants. Rendered in the browser, no zone label (ticket 04).
  { id: 's1', start: '2026-09-04T09:00:00Z', end: '2026-09-04T13:00:00Z' },
  { id: 's2', start: '2026-09-12T04:00:00Z', end: '2026-09-12T09:00:00Z' },
  { id: 's3', start: '2026-09-13T09:00:00Z', end: '2026-09-13T13:00:00Z' },
  { id: 's4', start: '2026-09-23T09:00:00Z', end: '2026-09-23T11:30:00Z' }
];

const OTHERS = [
  { id: 'brannock', char: 'Brannock Vole', player: 'Sam Okafor',      level: 4, lastPlayed: null,         declaredAt: '2026-08-21T10:00:00Z', slots: ['s2','s3'] },
  { id: 'wisp',     char: 'Wisp',          player: 'Tara Lindqvist',  level: 3, lastPlayed: '2026-06-10', declaredAt: '2026-08-20T21:00:00Z', slots: ['s1','s2','s4'] },
  { id: 'ganneth',  char: 'Ganneth Ur',    player: 'Marta Vance',     level: 4, lastPlayed: '2026-07-29', declaredAt: '2026-08-20T20:00:00Z', slots: ['s1','s2','s3','s4'] },
  { id: 'ilva',     char: 'Sister Ilva',   player: 'Jonah Reyes',     level: 5, lastPlayed: '2026-08-05', declaredAt: '2026-08-22T08:00:00Z', slots: ['s2','s3'] },
  { id: 'peck',     char: 'Peck',          player: 'Dmitri Sarn',     level: 2, lastPlayed: '2026-08-12', declaredAt: '2026-08-23T19:00:00Z', slots: ['s2','s4'] },
  { id: 'halgrim',  char: 'Halgrim Bright',player: 'Nia Osei',        level: 6, lastPlayed: '2026-08-19', declaredAt: '2026-08-24T12:00:00Z', slots: ['s1','s2','s3'] },
  { id: 'corvo',    char: 'Corvo Meade',   player: 'Felix Aumann',    level: 4, lastPlayed: '2026-08-22', declaredAt: '2026-08-25T09:00:00Z', slots: ['s2','s3','s4'] }
];

const ME = {
  player: 'you',
  lastPlayed: '2026-08-15',
  declaredAt: '2026-08-26T11:00:00Z',
  characters: [
    { id: 'kestrel', name: 'Kestrel Ashdown', level: 5 },
    { id: 'dob',     name: 'Dob Tunnelly',    level: 1 }
  ]
};

const SIDEBAR = [
  { name: 'The Tavern', kind: 'campaign', unread: true },
  { name: 'The Drowned Bell of Coldwater', when: 'Fri', current: true },
  { name: 'Smoke over the Hollow Fields', when: 'Sat', unread: true },
  { name: 'Bring the horses back', when: 'Sun' },
  { name: 'What is under the mill', when: '23 Sep' },
  { name: 'The Widow of Kettle Bridge', when: 'no slots' }
];

/* =========================================================================
   STATE
   ========================================================================= */

const params = new URLSearchParams(location.search);
const state = {
  variant: (params.get('variant') || 'A').toUpperCase(),
  declared: params.get('declared') !== '0',
  width: params.get('w') === 'phone' ? 'phone' : 'desktop',
  characterId: params.get('char') || 'kestrel',
  mySlots: new Set((params.has('mine') ? params.get('mine') : 's1,s2,s3').split(',').filter(Boolean))
};

const VARIANTS = { A: 'The Board', B: 'Four Dates', C: 'You First' };

function push() {
  const p = new URLSearchParams();
  p.set('variant', state.variant);
  p.set('declared', state.declared ? '1' : '0');
  p.set('w', state.width);
  p.set('char', state.characterId);
  p.set('mine', [...state.mySlots].join(','));
  history.replaceState(null, '', '?' + p.toString());
}

/* =========================================================================
   THE RULE — ADR 0003. Rank by who played least recently; never-played first;
   ties broken by who declared earliest. The cut takes the first `seats`.
   ========================================================================= */

function myEntry() {
  const c = ME.characters.find(c => c.id === state.characterId);
  return {
    id: 'me', char: c.name, player: 'You', level: c.level,
    lastPlayed: ME.lastPlayed, declaredAt: ME.declaredAt,
    slots: [...state.mySlots], me: true
  };
}

function interested() {
  const list = OTHERS.slice();
  if (state.declared) list.push(myEntry());
  return list.sort(byPriority);
}

function byPriority(a, b) {
  const av = a.lastPlayed ? Date.parse(a.lastPlayed) : -Infinity;
  const bv = b.lastPlayed ? Date.parse(b.lastPlayed) : -Infinity;
  if (av !== bv) return av - bv;
  return Date.parse(a.declaredAt) - Date.parse(b.declaredAt);
}

function slotOutcome(slot) {
  const runners = interested().filter(p => p.slots.includes(slot.id));
  const party = runners.slice(0, QUEST.seats);
  const waitlist = runners.slice(QUEST.seats);
  const meIndex = runners.findIndex(p => p.me);
  return {
    slot, runners, party, waitlist,
    short: Math.max(0, QUEST.seats - party.length),
    myRank: meIndex < 0 ? null : meIndex + 1,
    mySeated: meIndex >= 0 && meIndex < QUEST.seats,
    myWaitPosition: meIndex >= QUEST.seats ? meIndex + 1 - QUEST.seats : null
  };
}

function outcomes() { return SLOTS.map(slotOutcome); }

/* =========================================================================
   FORMATTING — mirrors local_time_controller.js: instants formatted in the
   viewer's browser, and deliberately NO timezone label (ticket 04).
   ========================================================================= */

const fDay  = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fDayL = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const fTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });

const day  = iso => fDay.format(new Date(iso));
const dayL = iso => fDayL.format(new Date(iso));
const span = s => fTime.format(new Date(s.start)) + '–' + fTime.format(new Date(s.end));
const hours = s => Math.round((Date.parse(s.end) - Date.parse(s.start)) / 36e5 * 10) / 10;

function ago(dateish) {
  if (!dateish) return 'never played';
  const days = Math.round((TODAY - Date.parse(dateish)) / 864e5);
  if (days < 28) return 'played ' + days + ' days ago';
  const weeks = Math.round(days / 7);
  return 'played ' + weeks + ' weeks ago';
}

function outOfRange(level) { return level < QUEST.levelRange[0] || level > QUEST.levelRange[1]; }
function initials(name) { return name.split(/[\s]+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
function hue(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function avatar(p, cls = '') {
  return `<span class="avatar ${cls}" style="background: oklch(58% 0.14 ${hue(p.char)})" title="${p.char} — ${p.player}">${initials(p.char)}</span>`;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

/* =========================================================================
   SHARED FRAGMENTS
   ========================================================================= */

function roomLink() {
  return `<a class="roomlink" href="#">
    <span class="glyph">&#128172;</span>
    <span>
      <span style="font-weight:600">Talk it over in the quest's room</span><br>
      <span class="tiny dim">${QUEST.room.messages} messages &middot; last from ${QUEST.room.lastFrom}, ${QUEST.room.lastAgo}</span>
    </span>
    <span class="arrow">&rarr;</span>
  </a>`;
}

function characterPicker() {
  const chosen = ME.characters.find(c => c.id === state.characterId);
  const opts = ME.characters.map(c => `
    <button class="btn" data-char="${c.id}" aria-pressed="${c.id === state.characterId}"
      style="${c.id === state.characterId ? 'border-color:var(--color-link);background:var(--color-selected)' : ''}">
      ${esc(c.name)} <span class="dim tiny">lvl ${c.level}${outOfRange(c.level) ? ' &#9651;' : ''}</span>
    </button>`).join(' ');
  const warn = outOfRange(chosen.level) ? `
    <div class="advisory">
      <span class="mark">&#9651;</span>
      <span><strong>${esc(chosen.name)} is level ${chosen.level}; this quest is pitched at levels ${QUEST.levelRange[0]}&ndash;${QUEST.levelRange[1]}.</strong>
      You can declare anyway &mdash; nothing here stops you. ${QUEST.gameMaster} will see the mismatch when they cut the party,
      and so will everyone else on the list.</span>
    </div>` : '';
  return { opts, warn, chosen };
}

function slotToggles() {
  return SLOTS.map(s => `
    <button class="slotchip" data-slot="${s.id}" aria-pressed="${state.mySlots.has(s.id)}">
      <span class="d">${day(s.start)}</span>
      <span class="t">${span(s)}</span>
    </button>`).join('');
}

/* =========================================================================
   VARIANT A — THE BOARD
   The availability matrix, rows in priority order, the cut visible per column.
   Your own row is the declaration control.
   ========================================================================= */

function renderA() {
  const outs = outcomes();
  const people = interested();
  const { opts, warn } = characterPicker();

  const head = SLOTS.map((s, i) => {
    const d = new Date(s.start);
    const wd = new Intl.DateTimeFormat(undefined, { weekday: 'short' }).format(d);
    const dt = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(d);
    const t1 = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(d);
    return `<th>
      <span class="wd">${wd}</span> <span class="dt">${dt}</span>
      <span class="t">${span(s)}</span><span class="tshort">${t1}</span>
      <span class="n">${outs[i].runners.length}/${people.length}</span></th>`;
  }).join('');

  const rows = people.map((p, idx) => {
    const cells = SLOTS.map((s, i) => {
      const o = outs[i];
      const can = p.slots.includes(s.id);
      const rank = o.runners.findIndex(r => r.id === p.id);
      const seated = can && rank > -1 && rank < QUEST.seats;
      const isCutRow = can && rank === Math.min(QUEST.seats, o.runners.length) - 1;
      const dot = !can
        ? '<span class="dot none">&middot;</span>'
        : `<span class="dot ${seated ? 'seated' : 'waiting'}"></span>`;
      if (p.me) {
        return `<td class="cell mycell ${isCutRow ? 'cut' : ''}">
          <button class="mytoggle" data-slot="${s.id}" title="${can ? 'I can make this — tap to remove' : 'Tap if you can make this'}">
            ${can ? dot : '<span class="dot none">+</span>'}
          </button></td>`;
      }
      return `<td class="cell ${isCutRow ? 'cut' : ''}">${dot}</td>`;
    }).join('');

    return `<tr class="${p.me ? 'me' : ''}">
      <th class="who"><span class="who-inner">
        <span class="who-rank">${idx + 1}</span>
        ${avatar(p)}
        <span>
          <span class="who-name">${esc(p.char)}${outOfRange(p.level) ? ' <span class="pill warn" title="outside levels ' + QUEST.levelRange.join('&ndash;') + '">&#9651; lvl ' + p.level + '</span>' : ''}</span>
          <span class="who-sub"><span class="player">${esc(p.player)} &middot; </span>${ago(p.lastPlayed)}</span>
        </span>
      </span></th>${cells}</tr>`;
  }).join('');

  const foot = outs.map(o => `<td>
      <strong>${o.party.length} seated</strong>
      ${o.short ? o.short + ' seat' + (o.short > 1 ? 's' : '') + ' short' : o.waitlist.length + ' waiting'}
    </td>`).join('');

  const mine = outs.filter(o => o.myRank);
  const mineLines = state.declared && mine.length
    ? mine.map(o => `<li><span class="d">${day(o.slot.start)}</span>
        ${o.mySeated
          ? `<span class="pill seat">seated</span> <span class="dim">${ord(o.myRank)} of ${o.runners.length}</span>`
          : `<span class="pill wait">${ord(o.myWaitPosition)} on the waitlist</span> <span class="dim">${ord(o.myRank)} of ${o.runners.length}</span>`}
      </li>`).join('')
    : '';

  return `
  <div style="display:flex;gap:0.75rem;align-items:flex-start;flex-wrap:wrap">
    <div style="flex:1 1 22rem;min-inline-size:0">
      <h1 style="font-size:1.5rem">${esc(QUEST.title)}</h1>
      <p class="small dim" style="margin:0.4rem 0 0">
        Proposed by ${esc(QUEST.proposedBy)} &middot; follows from <a href="#">${esc(QUEST.followsFrom)}</a><br>
        Levels ${QUEST.levelRange[0]}&ndash;${QUEST.levelRange[1]} &middot; party of ${QUEST.seats} &middot; ${esc(QUEST.gameMaster)} is offering ${SLOTS.length} dates
      </p>
    </div>
    <a class="btn" href="#">${QUEST.room.messages} messages &rarr;</a>
  </div>
  <p class="small" style="max-inline-size:44rem">${esc(QUEST.blurb)}
    <a href="#" class="tiny">more</a></p>

  <h2 style="font-size:1rem;margin-block-start:1.75rem">Who can make what</h2>
  <p class="tiny dim" style="margin:0.25rem 0 0">
    In order of who has played least recently &mdash; that is the order the party is cut in.
    Interest closes ${dayL(QUEST.interestCloses)}.</p>

  <div class="matrixwrap">
    <table class="matrix">
      <thead><tr><th class="who"></th>${head}</tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="who"></td>${foot}</tr></tfoot>
    </table>
  </div>
  <div class="legend">
    <span><i class="dot seated"></i> would get a seat</span>
    <span><i class="dot waiting"></i> would be on the waitlist</span>
    <span><i class="dot none">&middot;</i> can't make it</span>
    <span style="border-block-end:2px solid var(--color-seat)">the cut, if that date were confirmed today</span>
  </div>

  ${state.declared ? `
    <div class="card" style="margin-block-start:1.5rem">
      <div style="font-weight:600">Your row is live &mdash; tap the cells to change it.</div>
      <p class="small dim" style="margin:0.35rem 0 0.75rem">
        You ${ago(ME.lastPlayed)}, which puts you ${ord(interested().findIndex(p => p.me) + 1)} of ${interested().length} overall.
        Nothing is decided until ${esc(QUEST.gameMaster)} confirms one date.</p>
      <ul class="standing" style="list-style:none;margin:0;padding:0.75rem;display:grid;gap:0.45rem">${mineLines}</ul>
      <div style="margin-block-start:0.75rem">${opts}</div>
      <p class="tiny dim" style="margin:0.5rem 0 0">Which character you bring doesn't change your place in the order &mdash; that follows you, not them.</p>
      ${warn}
      <p class="tiny" style="margin-block-start:0.75rem"><a href="#">Withdraw my interest</a></p>
    </div>`
    : `<div class="card" style="margin-block-start:1.5rem">
      <div style="font-weight:600;margin-block-end:0.5rem">Go on this quest</div>
      <div>${opts}</div>
      ${warn}
      <p class="small dim" style="margin:0.75rem 0 0.5rem">Then tap the dates you could make:</p>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">${slotToggles()}</div>
      <p style="margin-block-start:0.9rem"><button class="btn primary" data-declare="1" ${state.mySlots.size ? '' : 'disabled title="Pick at least one date first"'}>Declare interest</button></p>
    </div>`}

  <div style="margin-block-start:1.5rem">${roomLink()}</div>`;
}

/* =========================================================================
   VARIANT B — FOUR DATES
   The matrix transposed into a stack of slot cards. No grid anywhere; the
   cross-tab is never shown, only each date's consequence.
   ========================================================================= */

function renderB() {
  const outs = outcomes();
  const total = interested().length;
  const { opts, warn } = characterPicker();

  const cards = outs.map(o => {
    const s = o.slot;
    const seats = o.party.map((p, i) => `
      <span class="seatchip ${p.me ? 'you' : ''}">${avatar(p, 'sm')}<span class="rank">${i + 1}</span> ${esc(p.char)}${outOfRange(p.level) ? ' <span class="dim">&#9651;</span>' : ''}</span>`).join('');
    const waits = o.waitlist.map((p, i) => `
      <span class="seatchip waiting ${p.me ? 'you' : ''}">${avatar(p, 'sm')}<span class="rank">${QUEST.seats + i + 1}</span> ${esc(p.char)}</span>`).join('');

    let verdict;
    if (!state.declared) verdict = `<span class="dim">Say whether you can make this</span>`;
    else if (o.myRank === null) verdict = `<span class="dim">You haven't said you can make this</span>`;
    else if (o.mySeated) verdict = `<span class="pill seat">You'd be on it</span> <span class="dim">${ord(o.myRank)} of ${o.runners.length}</span>`;
    else verdict = `<span class="pill wait">${ord(o.myWaitPosition)} on the waitlist</span> <span class="dim">${ord(o.myRank)} of ${o.runners.length} &mdash; ${o.myWaitPosition === 1 ? 'first seat to free up is yours' : 'ahead of ' + (o.waitlist.length - o.myWaitPosition) + ' others'}</span>`;

    return `<section class="slotcard ${o.myRank ? 'mine' : ''}">
      <header>
        <div>
          <div class="date">${day(s.start)}</div>
          <div class="time">${span(s)} &middot; about ${hours(s)} hours</div>
        </div>
        <div class="count"><b>${o.runners.length}</b>of ${total} can make it</div>
      </header>
      <div class="waitlabel">The party this date would produce</div>
      <div class="seatrow">${seats}${o.short ? `<span class="seatchip" style="background:transparent;border:1px dashed var(--color-border-darker);color:var(--color-dim)">${o.short} seat${o.short > 1 ? 's' : ''} unfilled</span>` : ''}</div>
      ${o.waitlist.length ? `<div class="waitlabel">Waiting</div><div class="seatrow">${waits}</div>` : ''}
      <div class="verdict">
        ${verdict}
        <span class="spacer"></span>
        <button class="slotchip" style="min-inline-size:0;padding:0.35rem 0.7rem" data-slot="${s.id}" aria-pressed="${state.mySlots.has(s.id)}">
          <span class="d">${state.mySlots.has(s.id) ? '&#10003; I can make this' : 'I can make this'}</span>
        </button>
      </div>
    </section>`;
  }).join('');

  return `
  <h1 style="font-size:1.5rem">${esc(QUEST.title)}</h1>
  <p class="small dim" style="margin:0.4rem 0 0.85rem">
    Proposed by ${esc(QUEST.proposedBy)} &middot; follows from <a href="#">${esc(QUEST.followsFrom)}</a><br>
    Levels ${QUEST.levelRange[0]}&ndash;${QUEST.levelRange[1]} &middot; party of ${QUEST.seats} &middot; run by ${esc(QUEST.gameMaster)}</p>
  <p class="small" style="max-inline-size:44rem">${esc(QUEST.blurb)} <a href="#" class="tiny">more</a></p>

  <div style="margin-block:1.25rem">${roomLink()}</div>

  <div class="card" style="margin-block-end:1.25rem">
    <div style="font-weight:600;margin-block-end:0.5rem">${state.declared ? 'You’re going as' : 'Going as'}</div>
    <div>${opts}</div>
    ${warn}
    ${state.declared
      ? `<p class="tiny dim" style="margin:0.75rem 0 0">Tick the dates below. You can change them until interest closes on ${dayL(QUEST.interestCloses)}. <a href="#">Withdraw</a></p>`
      : `<p class="small dim" style="margin:0.75rem 0 0">Then tick every date you could make, below. Ticking one is what declares your interest.</p>`}
  </div>

  <h2 style="font-size:1rem;margin-block-end:0.6rem">${SLOTS.length} possible dates</h2>
  ${cards}

  <p class="tiny dim" style="margin-block-start:1rem">
    Nothing is decided yet. ${esc(QUEST.gameMaster)} picks one of these dates after interest closes, and the party is cut
    by who has played least recently. These lists move every time someone new declares.</p>`;
}

/* =========================================================================
   VARIANT C — YOU FIRST
   Your declaration leads. The collective picture is reduced to counts;
   who is interested is behind a disclosure. Tests Colvillian's hidden list.
   ========================================================================= */

function renderC() {
  const outs = outcomes();
  const total = interested().length;
  const { opts, warn } = characterPicker();
  const mine = outs.filter(o => o.myRank);
  const seated = mine.filter(o => o.mySeated);

  const headline = !state.declared
    ? 'Say you want to go'
    : seated.length === mine.length
      ? `You'd get a seat on ${seated.length === 1 ? 'the date you picked' : 'all ' + seated.length + ' dates you picked'}`
      : seated.length
        ? `You'd get a seat on ${seated.length} of the ${mine.length} dates you picked`
        : `You're on the waitlist for now`;

  const lines = mine.map(o => `<li>
      <span class="d">${day(o.slot.start)}</span>
      ${o.mySeated
        ? `<span class="pill seat">seated</span>`
        : `<span class="pill wait">waitlist ${o.myWaitPosition}</span>`}
      <span class="dim tiny">${ord(o.myRank)} of ${o.runners.length} who can make it</span>
    </li>`).join('');

  const heat = outs.map(o => `
    <div class="heatrow ${o.myRank ? 'yours' : ''}">
      <span>${day(o.slot.start)}<br><span class="tiny dim">${span(o.slot)}</span></span>
      <span class="heatbar"><i style="inline-size:${Math.round(o.runners.length / total * 100)}%"></i></span>
      <span class="n">${o.runners.length}</span>
    </div>`).join('');

  const roster = interested().map((p, i) => `
    <div class="row">${avatar(p, 'sm')}<span>${esc(p.char)}</span>
      ${outOfRange(p.level) ? '<span class="pill warn">&#9651; lvl ' + p.level + '</span>' : ''}
      <span class="when">${ago(p.lastPlayed)}</span></div>`).join('');

  return `
  <h1 style="font-size:1.5rem">${esc(QUEST.title)}</h1>
  <p class="small dim" style="margin:0.4rem 0 1.25rem">
    Levels ${QUEST.levelRange[0]}&ndash;${QUEST.levelRange[1]} &middot; party of ${QUEST.seats} &middot;
    proposed by ${esc(QUEST.proposedBy)} &middot; run by ${esc(QUEST.gameMaster)}</p>

  <div class="twocol">
    <div>
      <div class="standing">
        <div class="headline">${headline}</div>
        ${state.declared
          ? `<p class="small dim" style="margin:0.4rem 0 0">You ${ago(ME.lastPlayed)}. The people who have waited longer go first,
              so this moves as others declare &mdash; and it isn't settled until ${esc(QUEST.gameMaster)} picks a date after
              interest closes ${dayL(QUEST.interestCloses)}.</p>
             <ul>${lines}</ul>`
          : `<p class="small dim" style="margin:0.4rem 0 0">Pick a character and the dates you could make.
              We'll show you where you'd stand before anything is decided.</p>`}
      </div>

      <div class="card" style="margin-block-start:1rem">
        <div class="small" style="font-weight:600;margin-block-end:0.5rem">Bringing</div>
        <div>${opts}</div>
        ${warn}
        <div class="small" style="font-weight:600;margin:1rem 0 0.5rem">Dates you can make</div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">${slotToggles()}</div>
        ${state.declared
          ? `<p class="tiny dim" style="margin:0.75rem 0 0">Saved as you go. <a href="#">Withdraw my interest</a></p>`
          : `<p style="margin-block-start:0.9rem"><button class="btn primary" data-declare="1" ${state.mySlots.size ? '' : 'disabled title="Pick at least one date first"'}>Declare interest</button></p>`}
      </div>

      <h2 style="font-size:0.9375rem;margin-block-start:1.75rem">How the dates are looking</h2>
      <p class="tiny dim" style="margin:0.25rem 0 0.6rem">${total} ${total === 1 ? 'character has' : 'characters have'} declared so far.</p>
      <div class="heat">${heat}</div>

      <details class="roster">
        <summary>Who's interested (${total})</summary>
        <div class="rosterlist">${roster}</div>
        <p class="tiny dim">Shown in the order the party would be cut in.</p>
      </details>
    </div>

    <aside>
      <div class="card">
        <div class="small" style="font-weight:600;margin-block-end:0.35rem">The plan</div>
        <p class="small" style="margin:0">${esc(QUEST.blurb)}</p>
        <p class="tiny" style="margin:0.6rem 0 0"><a href="#">Read the whole thing</a></p>
        <p class="tiny dim" style="margin:0.6rem 0 0">Follows from <a href="#">${esc(QUEST.followsFrom)}</a></p>
      </div>
      <div style="margin-block-start:0.75rem">${roomLink()}</div>
    </aside>
  </div>`;
}

/* =========================================================================
   CHROME + SWITCHER
   ========================================================================= */

function renderChrome() {
  document.getElementById('sidebar').innerHTML = `
    <div style="font-weight:700;padding:0 0.5rem 0.5rem">The Ash Marches</div>
    <h4>Campaign</h4>
    ${SIDEBAR.filter(r => r.kind === 'campaign').map(r => `<a href="#" class="${r.unread ? 'unread' : ''}">${esc(r.name)}</a>`).join('')}
    <h4>Quests</h4>
    ${SIDEBAR.filter(r => r.kind !== 'campaign').map(r => `
      <a href="#" class="${r.current ? 'current' : ''} ${r.unread ? 'unread' : ''}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
        <span class="when">${r.when}</span></a>`).join('')}
    <p class="tiny dim" style="padding:0.75rem 0.5rem">Live quests only, soonest date first. Finished quests are reached from the quest itself.</p>`;

  document.getElementById('topbar').innerHTML = `
    <a class="back" href="#">&larr;</a>
    <span class="crumb">Quests</span>
    <span class="crumb">/ proposed</span>
    <span style="margin-inline-start:auto" class="pill">interest closes ${day(QUEST.interestCloses)}</span>`;
}

function render() {
  document.getElementById('frame').className = state.width === 'phone' ? 'phone' : '';
  renderChrome();
  document.getElementById('main').innerHTML =
    state.variant === 'B' ? renderB() : state.variant === 'C' ? renderC() : renderA();
  renderSwitcher();
  push();
}

function renderSwitcher() {
  const keys = Object.keys(VARIANTS);
  document.getElementById('switcher').innerHTML = `
    <div class="bar">
      <button data-cycle="-1" aria-label="previous variant">&larr;</button>
      <span class="label">${state.variant} &middot; ${VARIANTS[state.variant]}</span>
      <button data-cycle="1" aria-label="next variant">&rarr;</button>
      <span class="sep"></span>
      <span class="grp"><em>you</em>
        <button data-declared="0" aria-pressed="${!state.declared}">not declared</button>
        <button data-declared="1" aria-pressed="${state.declared}">declared</button>
      </span>
      <span class="sep"></span>
      <span class="grp"><em>width</em>
        <button data-width="desktop" aria-pressed="${state.width === 'desktop'}">desktop</button>
        <button data-width="phone" aria-pressed="${state.width === 'phone'}">phone</button>
      </span>
    </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cycle],[data-declared],[data-width],[data-slot],[data-char],[data-declare]');
  if (!t) return;
  e.preventDefault();
  const keys = Object.keys(VARIANTS);

  if (t.dataset.cycle) {
    const i = keys.indexOf(state.variant);
    state.variant = keys[(i + Number(t.dataset.cycle) + keys.length) % keys.length];
  } else if (t.dataset.declared) {
    state.declared = t.dataset.declared === '1';
  } else if (t.dataset.width) {
    state.width = t.dataset.width;
  } else if (t.dataset.char) {
    state.characterId = t.dataset.char;
  } else if (t.dataset.declare) {
    if (state.mySlots.size) state.declared = true;
  } else if (t.dataset.slot) {
    const id = t.dataset.slot;
    state.mySlots.has(id) ? state.mySlots.delete(id) : state.mySlots.add(id);
    // In B the tick IS the declaration; A and C have an explicit button.
    if (state.variant === 'B' && state.mySlots.size) state.declared = true;
    // Interest with no date is meaningless, so unticking your last date withdraws you.
    if (state.mySlots.size === 0) state.declared = false;
  }
  render();
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(state.variant);
  state.variant = keys[(i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length];
  render();
});

render();
</script>
</body>
</html>
